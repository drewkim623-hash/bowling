/* ======================================================================
   WHO ARE YOU

   The front door. Everybody the book already knows, laid out to be tapped.
   Three kinds of face, and the difference is entirely about what it would
   cost to be wrong about who somebody is:

     a guest      — a name and nothing else. Nothing to steal, so tapping it
                    signs you in and pulls their money onto you. Confirmed
                    first, because it moves real money onto a real person.
     an account
     this device
     has met      — the session is in the ring. Tap and you are in.
     any other
     account      — has a password. Asking for it is the whole point; a face
                    is not a credential.
   ====================================================================== */
function whoAreYouCard(){
  const box = card();
  const msg = h('div.err', {});

  const guests = state.guests.slice()
    .sort((a, b) => a.name.localeCompare(b.name));
  const accounts = state.profiles.slice()
    .sort((a, b) => (deviceKnows(b.id) - deviceKnows(a.id))
                 || String(a.display_name || '').localeCompare(String(b.display_name || '')));

  const face = (label, sub, kid, run) =>
    h('button.person.tap', { onclick: run },
      h('div.row', {}, kid,
        h('div', { style:{ minWidth:0 } },
          h('div', { style:{ fontWeight:650, fontSize:'13px' } }, label),
          h('div.tiny.muted', {}, sub))));

  const people = h('div.people', {});
  /* Three states, and the difference is only ever what it would cost to be
     wrong about somebody:
       this device knows them  — put the session back, straight in
       they have a password    — ask for it; a name is not a way in
       they never made one     — there is nothing to ask for. A name with no
                                 password behind it is a guest by another
                                 word, so it is walked into the same way. */
  for (const p of accounts){
    const known = deviceKnows(p.id);
    const locked = !!p.has_login;
    people.append(face(p.display_name || 'Bowler',
      known ? 'tap to sign in' : locked ? 'needs a password' : 'no password — tap to be them',
      avatar(p),
      () => known ? resumeFace(p) : locked ? passwordFor(p)
                  : claimFace({ id: p.id, name: p.display_name || 'Bowler', profile: true })));
  }
  for (const g of guests)
    people.append(face(g.name, 'guest', nameChip(g.name), () => claimFace(g)));

  /* Somebody who has signed in here before is the likeliest person holding
     the phone, so their face leads. A brand new database has no faces at
     all, and then this is just a name and a button. */
  async function resumeFace(p){
    msg.textContent = '';
    try { await db.resume(p.id); await boot(true); toast('Hello again, ' + (p.display_name || '') + '.'); }
    catch (err){
      if (String(err.message) === 'STALE'){ passwordFor(p, 'This device was signed out. Password once more.'); return; }
      msg.className = 'err'; msg.textContent = err.message || String(err);
    }
  }

  function passwordFor(p, note){
    /* profiles has no email column and auth.users is not readable, so there
       is no address to pre-fill here. Asking for it is the honest cost of
       not publishing everybody's email to anyone who opens the site. */
    const email = h('input', { type:'email', placeholder:'you@example.com', autocomplete:'email' });
    const pass  = h('input', { type:'password', placeholder:'your password', autocomplete:'current-password' });
    const err2  = h('div.err', {}, note || '');
    openSheet('Signing in as ' + (p.display_name || 'this account'), body => {
      body.append(
        h('label.f', {}, h('span', {}, 'Email'), email),
        h('label.f', {}, h('span', {}, 'Password'), pass), err2,
        h('button.btn.pri.wide.big', { style:{ marginTop:'12px' }, async onclick(){
          err2.className = 'err'; err2.textContent = '';
          try { await db.signIn({ email: email.value.trim(), password: pass.value });
                closeSheet(); await boot(true); }
          catch (e2){ err2.textContent = e2.message || String(e2); }
        } }, 'Sign in'),
        h('button.btn.wide', { style:{ marginTop:'8px' }, async onclick(){
          err2.className = 'err'; err2.textContent = '';
          try {
            if (!email.value.trim()) throw new Error('Type your email address first.');
            await db.magic({ email: email.value.trim() });
            err2.className = 'ok'; err2.textContent = 'Sent. Open the link in your email and you are in.';
          } catch (e2){ err2.textContent = e2.message || String(e2); }
        } }, 'Email me a link instead'));
    }, 'This account has a password. A name on a list is not a way in.');
  }

  function claimFace(g){
    const berr = h('div.err', {});
    const owed = moneySummaryKey(g.profile ? keyOfProfile(g.id) : keyOfGuest(g.id));
    const bits = [];
    if (owed.nights) bits.push(`${money(owed.net)} across ${owed.nights} ${owed.nights === 1 ? 'night' : 'nights'}`);
    openSheet('Is this you?', body => {
      body.append(
        h('p.small.ink2', {}, bits.length
          ? `Everything the book has under ${g.name} — ${bits.join(', ')} — becomes yours.`
          : `You will become ${g.name}.`),
        h('p.tiny.muted', { style:{ marginTop:'6px' } }, g.profile
          ? `${g.name} never put a password on this, so there is nothing to type. Tapping it is the way back in.`
          : `“${g.name}” stops being a guest.`),
        berr,
        h('button.btn.pri.wide.big', { style:{ marginTop:'12px' }, async onclick(){
          berr.className = 'err'; berr.textContent = '';
          try {
            await db.anon({ name: g.name });
            if (g.profile) await db.claimProfile(g.id); else await db.claimGuest(g.id);
            closeSheet(); await boot(true); toast(`You are ${g.name}.`);
          } catch (err){ berr.className = 'err'; berr.textContent = err.message || String(err); }
        } }, `Yes, I'm ${g.name}`),
        h('button.btn.wide', { style:{ marginTop:'8px' }, onclick: closeSheet }, 'No, that is somebody else'));
    }, 'This takes over their whole history. Worth being sure.');
  }

  /* Nobody on the list. A name, and in you go. */
  const fresh = h('input', { type:'text', placeholder:'the name everyone calls you' });
  const newcomer = h('div', { style:{ display:'none' } },
    h('label.f', { style:{ marginTop:'10px' } }, h('span', {}, 'Your name'), fresh),
    h('button.btn.pri.wide', { style:{ marginTop:'8px' }, async onclick(){
      msg.textContent = '';
      const n = fresh.value.trim();
      if (!n){ msg.className = 'err'; msg.textContent = 'Tell us your name first.'; return; }
      try { await db.anon({ name: n }); await boot(true); toast('You are in.'); }
      catch (err){ msg.className = 'err'; msg.textContent = err.message || String(err); }
    } }, 'Start bowling'));

  const oldAccount = h('div', { style:{ display:'none' } }, authCard(true));

  box.append(
    h('div.spread', {},
      h('div', {}, h('h2', {}, 'Who is bowling?'),
        h('p.sub.small.muted', {}, 'Tap yourself. No account needed \u2014 and you can read everything below without one.'))),
    people.children.length ? people : h('p.small.muted', {}, 'Nobody in the book yet. Put your name in and you are the first.'),
    msg,
    h('button.btn.wide', { style:{ marginTop:'10px' }, onclick(){
      newcomer.style.display = newcomer.style.display === 'none' ? 'block' : 'none';
      if (newcomer.style.display === 'block') fresh.focus();
    } }, 'I am not on this list'),
    newcomer,
    h('button.btn.wide', { style:{ marginTop:'8px' }, onclick(){
      oldAccount.style.display = oldAccount.style.display === 'none' ? 'block' : 'none';
    } }, 'I already have an account'),
    oldAccount);
  return box;
}

function authCard(bare){

  const pass  = h('input', { type:'password', placeholder:'at least 6 characters', autocomplete:'current-password' });
  const name  = h('input', { type:'text', placeholder:'the name everyone calls you' });
  const msg   = h('div.err', {});
  let mode = 'in';
  /* Bare when it is folded inside the chooser, which is already a card. */
  const box = bare ? h('div', {}) : card();
  function draw(){
    clear(box);
    box.append(
      h('div.seg', {},
        h('button', { 'aria-pressed': mode === 'in',  onclick(){ mode = 'in';  draw(); } }, 'Sign in'),
        h('button', { 'aria-pressed': mode === 'up',  onclick(){ mode = 'up';  draw(); } }, 'Create an account')),
      /* spread, not a bare null: box.append is the DOM's own, and it turns a
         null argument into the literal text "null" on the sign-in screen. */
      ...(mode === 'up' ? [h('label.f', {}, h('span', {}, 'Display name'), name)] : []),
      h('label.f', {}, h('span', {}, 'Email'), email),
      h('label.f', {}, h('span', {}, 'Password'), pass),
      msg,
      h('button.btn.pri.wide.big', { style:{ marginTop:'12px' }, async onclick(){
        msg.textContent = '';
        try {
          if (mode === 'up'){
            if (!name.value.trim()) throw new Error('Tell us your name first.');
            await db.signUp({ email: email.value.trim(), password: pass.value, name: name.value.trim() });
            msg.className = 'ok';
            msg.textContent = 'Account made. Check your email if it asks you to confirm, then sign in.';
          } else {
            await db.signIn({ email: email.value.trim(), password: pass.value });
          }
          await boot(true);
        } catch (err){ msg.className = 'err'; msg.textContent = err.message || String(err); }
      } }, mode === 'up' ? 'Create account' : 'Sign in'),
      h('button.btn.wide', { style:{ marginTop:'8px' }, async onclick(){
        msg.textContent = '';
        try {
          if (!email.value.trim()) throw new Error('Type your email address first.');
          await db.magic({ email: email.value.trim() });
          msg.className = 'ok'; msg.textContent = 'Sent. Open the link in your email and you are in — no password needed.';
        } catch (err){ msg.className = 'err'; msg.textContent = err.message || String(err); }
      } }, 'Email me a sign-in link instead'),
      /* Spread again, same reason as the display name above: a bare null
         handed to box.append lands on the page as the word "null". */
      ...(bare ? [] : [h('p.tiny.muted', { style:{ marginTop:'10px' } },
        'Everything on this site is readable without an account. Signing in is only for adding scores.')]));
  }
  draw();
  return box;
}

function profileSetup(){
  const p = state.me || {};
  const name = h('input', { type:'text', value: p.display_name || '', placeholder:'e.g. Drew' });
  const hand = h('select', {}, [['R','Right'],['L','Left']].map(([v,l]) =>
    h('option', { value:v, selected: p.hand === v }, l)));
  const weight = h('input', { type:'number', min:6, max:20, value: p.ball_weight || 15 });
  const house = h('input', { type:'text', list:'houses2', value: p.home_house || HOUSES[0] });
  const avatarUrl = h('input', { type:'text', value: p.avatar_url || '', placeholder:'or paste a link to one' });
  const file = h('input', { type:'file', accept:'image/*', style:{ display:'none' },
    onchange(){
      const f = file.files && file.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => { clear(shot); shot.append(h('img', { src:r.result, alt:'' })); };
      r.readAsDataURL(f);
    } });
  const shot = h('div.av.xl', {});
  if (p.avatar_url) shot.append(h('img', { src:p.avatar_url, alt:'' }));
  else shot.append(initials(p.display_name || name.value || '?'));
  const msg = h('div.err', {});
  return card(
    h('h2', {}, state.me && state.me.hand ? 'Your profile' : 'One quick thing first'),
    h('p.sub', { style:{ marginTop:'4px' } }, 'Thirty seconds and you never see this again.'),
    h('label.f', {}, h('span', {}, 'Display name'), name),
    h('label.f', {}, h('span', {}, 'Which hand do you bowl with?'), hand),
    h('label.f', {}, h('span', {}, 'Usual ball weight (pounds)'), weight),
    h('label.f', {}, h('span', {}, 'Home alley'), house),
    h('datalist', { id:'houses2' }, HOUSES.map(x => h('option', { value:x }))),
    h('div.photo', {},
      shot,
      h('div', {}, h('div', { style:{ fontWeight:650 } }, 'Your picture'),
        h('div.tiny.muted', { style:{ margin:'2px 0 8px' } }, 'Shows up next to your name everywhere.'),
        h('button.btn.sm', { onclick(){ file.click(); } }, p.avatar_url ? 'Change photo' : 'Choose a photo'),
        p.avatar_url ? h('button.btn.sm', { style:{ marginLeft:'6px' },
          onclick(){ avatarUrl.value = ''; file.value = ''; clear(shot); shot.append(initials(p.display_name || '?')); toast('Removed — save to confirm'); } }, 'Remove') : null),
      file),
    h('details.gloss', { style:{ margin:'10px 0 0' } },
      h('summary', {}, 'Rather paste a link?'), h('div', { style:{ padding:'0 14px 14px' } }, avatarUrl)),
    msg,
    h('button.btn.pri.wide.big', { style:{ marginTop:'12px' }, async onclick(){
      msg.className = 'err'; msg.textContent = '';
      if (!name.value.trim()){ msg.textContent = 'A name, please.'; return; }
      let url = avatarUrl.value.trim() || null;
      try {
        if (file.files && file.files[0]){
          const f = file.files[0];
          if (db.kind === 'live'){
            const key = `${state.user.id}/${Date.now()}-${f.name.replace(/[^\w.\-]/g,'')}`;
            const { error } = await db.sb.storage.from('avatars').upload(key, f, { upsert:true });
            if (error) throw error;
            url = db.sb.storage.from('avatars').getPublicUrl(key).data.publicUrl;
          } else {
            url = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
          }
        }
        await db.saveProfile({
          display_name: name.value.trim(), hand: hand.value,
          ball_weight: Number(weight.value) || null, home_house: house.value.trim() || null,
          avatar_url: url,
          handle: (p.handle || name.value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,20) || null),
        });
        await load(); toast('Saved'); render();
      } catch (err){ msg.textContent = err.message || String(err); }
    } }, 'Save and carry on'));
}

function activityFeed(limit = 30){
  const items = [];
  for (const g of D.games) items.push({ at: g.created_at, kind:'log', g });
  for (const e of state.edits) items.push({ at: e.at, kind: e.after ? 'edit' : 'delete', e });
  items.sort((a,b) => String(b.at).localeCompare(String(a.at)));
  const list = items.slice(0, limit);
  if (!list.length) return h('p.empty', {}, 'Nothing logged yet.');
  return h('div', {}, list.map(it => {
    if (it.kind === 'log'){
      const g = it.g, who = D.profile.get(g.profile_id), by = D.profile.get(g.logged_by);
      const self = g.profile_id === g.logged_by;
      return h('button.feed.tap', { style:{ width:'100%' }, onclick(){ showGame(g.id); } },
        avatar(who),
        h('div', {},
          h('div.small', {}, h('b', {}, who?.display_name || '?'), ' bowled ',
            h('b.n', {}, g.total_score), quickDot(g),
            g.edits.length ? h('span.chip', { style:{ marginLeft:'6px' } }, 'edited') : null),
          h('div.tiny.muted', {}, self ? 'logged it themselves' : `logged by ${by?.display_name || 'someone'}`,
            ' · ', shortDate(g.played_on))),
        h('div.when', {}, ago(it.at)));
    }
    const e = it.e, editor = D.profile.get(e.editor_id);
    const g = D.games.find(x => x.id === e.game_id);
    const subject = D.profile.get((e.before && e.before.profile_id) || g?.profile_id);
    return h('div.feed', {}, avatar(editor),
      h('div', {}, h('div.small', {},
          h('b', {}, editor?.display_name || 'Someone'),
          it.kind === 'delete' ? ' deleted ' : ' changed ',
          h('b', {}, (subject?.display_name || 'a') + '’s'), ' game',
          e.before && e.after ? ` from ${e.before.total_score} to ${e.after.total_score}` :
          e.before ? ` (was ${e.before.total_score})` : ''),
        h('div.tiny.muted', {}, 'every change is kept')),
      h('div.when', {}, ago(it.at)));
  }));
}

      h('button.btn.sm', { style:{ marginTop:'12px' }, onclick(){ go('log'); } },

    box.append(glossary(MONEY_GLOSS));
    box.append(buildStamp());
    return box;
  }

  box.append(sectionHead('The bowling',
    'Pins, for whoever logs them. None of it is needed to keep a night.'));

  if (D.leader){
    box.append(h('div.champ', {},
      h('div.spread', {},

  box.append(h('div.card.pad0', {}, leaderboardTable(D.ranked)));

  box.append(h('div.card.pad0', {}, handicapTable(D.ranked.concat(D.unranked))));

function rollingAverage(games, window = 10){
  const pts = [];
  for (let i = 0; i < games.length; i++){
    const slice = games.slice(Math.max(0, i - window + 1), i + 1);
    pts.push({ x: shortDate(games[i].played_on), y: slice.reduce((s,g) => s + g.total_score, 0) / slice.length });
  }
  return pts;
}

const personKey = m => m.profile_id ? 'p:' + m.profile_id : 'g:' + m.guest_id;
const keyOfProfile = id => 'p:' + id;
const keyOfGuest = id => 'g:' + id;
function personName(key){
  const [kind, id] = [key.slice(0,1), key.slice(2)];
  return kind === 'p' ? (D.profile.get(id)?.display_name || 'Someone')
                      : (D.guest.get(id)?.name || 'Guest');
}
const personIsGuest = key => key.slice(0,1) === 'g';
function personRow(key){
  return personIsGuest(key) ? { profile_id:null, guest_id:key.slice(2) }
                            : { profile_id:key.slice(2), guest_id:null };
}
/* Every night this person had money on it, in order. */
function moneyNightsForKey(key){
  const by = new Map();
  for (const m of state.money){
    if (personKey(m) !== key) continue;
    by.set(m.session_id, (by.get(m.session_id) || 0) + m.amount_cents);
  }
  return [...by.entries()].map(([sid, cents]) => ({
    sid, cents, played_on: D.session.get(sid)?.played_on || '' }))
    .sort((a,b) => a.played_on.localeCompare(b.played_on));
}
/* What the money says about one person: what they took, what they paid for,
   and who they took it with. Everything here works for a guest. */
function moneyRecord(key, recs = D.recordOf){
  const r = recs.get(key);
  const net = D.moneyByPerson.get(key) || 0;
  const base = { key, name: personName(key), guest: personIsGuest(key),
                 profile: personIsGuest(key) ? null : D.profile.get(key.slice(2)), net };
  if (!r) return { ...base, won:0, lost:0, even:0, played:0, winPct:null, rating:null, nights:0, mates:[] };
  const played = r.won + r.lost + (r.even || 0);
  const mates = [...r.mates.entries()]
    .map(([k, m]) => ({ key:k, name: personName(k), n:m.n, won:m.won,
                        winPct: m.n ? (m.won / m.n) * 100 : null }))
    .sort((a,b) => b.n - a.n);
  return { ...base, won:r.won, lost:r.lost, even:r.even, played,
           winPct: played ? (r.won / played) * 100 : null,
           weighted: r.wden ? (r.wpoints / r.wden) * 100 : null,
           /* where you finished, averaged. Identical to win % on a night of
              straight two-sided games, and pulls apart from it the moment
              somebody wins a four-way by more than somebody else. */
           rating: r.scored ? (r.points / r.scored) * 100 : null,
           nights: r.nights.size, mates,
           best: mates.filter(m => m.n >= 3).sort((a,b) => b.winPct - a.winPct)[0] || null,
           worst: mates.filter(m => m.n >= 3).sort((a,b) => a.winPct - b.winPct)[0] || null };
}
/* One night, added up: who won what and who ended where. The ledger works out
   the same thing from what you are typing right now; this is for every night
   that is already written down. */
function nightTallyOf(sid){
  const tally = new Map();
  for (const r of (D.roundsOfNight.get(sid) || []))
    for (const t of r.teams) for (const key of t.players){
      const e = tally.get(key) || { key, won:0, lost:0, even:0, net:0 };
      if (t.won) e.won++; else if (t.lost) e.lost++; else e.even++;
      tally.set(key, e);
    }
  for (const m of (D.moneyBySession.get(sid) || [])){
    const e = tally.get(personKey(m));
    if (e) e.net += m.amount_cents;
  }
  return [...tally.values()].sort((a, b) => b.net - a.net);
}
function writeUpOf(ses){
  const tally = nightTallyOf(ses.id);
  if (!tally.length) return null;
  return B.writeUp({
    played_on: ses.played_on, house: ses.house, title: ses.title,
    totals: tally.map(t => ({ ...t, name: personName(t.key) })),
    rounds: (D.roundsOfNight.get(ses.id) || []).map(r => ({ ...r,
      teams: r.teams.map(t => ({ ...t, players: t.players.map(personName) })) })),
    goingIn: formGoingIn(ses.id, tally.map(t => t.key)),
  });
}
/* One night as a card. Home shows the last one, Sessions shows all of them,
   and neither needs a score to have been logged. */
function moneyNightCard(ses, { onclick } = {}){
  const tally = nightTallyOf(ses.id);
  const games = (D.roundsOfNight.get(ses.id) || []).length;
  const up = tally[0], down = tally[tally.length - 1];
  const story = writeUpOf(ses);
  return h('button.card.tap.nightcard', { onclick: onclick || (() => openMoneyNight(ses.id)) },
    h('div.spread', {},
      h('div.when', {}, dateLabel(ses.played_on)),
      h('span.chip', { cls: ses.finished_at ? 'on' : '' },
        ses.finished_at ? 'finished' : `${games} game${games === 1 ? '' : 's'}`)),
    h('div.head', {}, story ? story.headline : `${ses.house}`),
    h('div.tiny.muted', { style:{ marginTop:'4px' } },
      `${ses.house}${ses.title ? ' · ' + ses.title : ''}`),
    /* the two ends of the night, which is what anybody asks about first */
    (up && down && up !== down) ? h('div.ends', {},
      h('div.end', {}, h('div.lab', {}, 'Up the most'),
        h('div.nm', {}, personName(up.key)),
        h('div.v.up', {}, money(up.net))),
      h('div.end', {}, h('div.lab', {}, 'Down the most'),
        h('div.nm', {}, personName(down.key)),
        h('div.v.dn', {}, money(down.net)))) : null,
    /* and then everybody, wrapped so nobody falls off the side */
    h('div.everyone', {}, tally.map(t =>
      h('span.chip', {}, personName(t.key), ' ', moneyPill(t.net), ' ',
        h('span.tiny.muted', {}, wl(t))))));
}

/* The most recent night that has money on it — the one you would want back. */
function lastNight(){
  return D.sessions.find(x => (D.roundsOfNight.get(x.id) || []).length) || null;
}

/* Everybody the book knows about, accounts and guests alike. */
function everyPersonKey(){
  return [...new Set([
    ...state.profiles.map(p => keyOfProfile(p.id)),
    ...state.guests.map(g => keyOfGuest(g.id)),
    ...state.money.map(personKey),
  ])];
}
const wl = r => `${r.won}\u2013${r.lost}` + (r.even ? `\u2013${r.even}` : '');

function moneySummaryKey(key){
  const nights = moneyNightsForKey(key);
  const cents = nights.map(n => n.cents);
  return {
    key, name: personName(key), guest: personIsGuest(key),
    profile: personIsGuest(key) ? null : D.profile.get(key.slice(2)),
    net: cents.reduce((a,b) => a+b, 0),
    nights: nights.length,
    best: cents.length ? Math.max(...cents) : null,
    worst: cents.length ? Math.min(...cents) : null,
    perNight: cents.length ? cents.reduce((a,b) => a+b, 0) / cents.length : null,
    up: cents.filter(c => c > 0).length,
    down: cents.filter(c => c < 0).length,
    list: nights,
  };
}
function moneySummary(pid){
  const nights = (D.stats.get(pid)?.moneyNights) || [];
  const cents = nights.map(n => n.cents);
  return {
    net: cents.reduce((a, b) => a + b, 0),
    nights: nights.length,
    best: cents.length ? Math.max(...cents) : null,
    worst: cents.length ? Math.min(...cents) : null,
    perNight: cents.length ? cents.reduce((a,b) => a+b, 0) / cents.length : null,
    up: cents.filter(c => c > 0).length,
    down: cents.filter(c => c < 0).length,
    list: nights,
  };
}

function moneyNightForm(){
  const box = h('div', {});
  const today = new Date().toISOString().slice(0,10);
  const date = h('input', { type:'date', value: today, max: today });
  const house = h('input', { type:'text', list:'mhouses', value: HOUSES[0], placeholder:'Where?' });
  const title = h('input', { type:'text', placeholder:'optional — “Tony’s revenge”' });
  const chosen = new Set(state.me ? [keyOfProfile(state.me.id)] : []);
  const people = h('div.people', {});
  const guestName = h('input', { type:'text', placeholder:'name' });

  function drawPeople(){
    clear(people);
    const everyone = [
      ...state.profiles.map(p => ({ key: keyOfProfile(p.id), name: p.display_name, profile: p })),
      ...state.guests.map(g => ({ key: keyOfGuest(g.id), name: g.name, profile: null })),
    ].sort((a,b) => a.name.localeCompare(b.name));
    for (const p of everyone){
      const on = chosen.has(p.key);
      const card2 = h('button.person.tap', { style: on ? { borderColor:'var(--blue)' } : {},
        onclick(){ on ? chosen.delete(p.key) : chosen.add(p.key); drawPeople(); } },
        h('div.row', {}, p.profile ? avatar(p.profile) : nameChip(p.name),
          h('div', { style:{ minWidth:0 } }, h('div', { style:{ fontWeight:650, fontSize:'13px' } }, p.name),
            h('div.tiny', { cls: on ? 'good' : 'muted' }, on ? 'in' : (p.profile ? 'tap to add' : 'guest')))));
      /* No delete here. This is the list you tap through at speed to say who
         turned up, and a button that erases somebody's whole history does not
         belong under a thumb doing that. It is on the People tab. */
      people.append(card2);
    }
  }
  drawPeople();

  box.append(
    sectionHead('Start a night', 'Who is here. Money only — nobody has to log a score.'),
    card(h('label.f', {}, h('span', {}, 'Date'), date),
      h('label.f', {}, h('span', {}, 'Where'), house),
      h('datalist', { id:'mhouses' }, HOUSES.map(x => h('option', { value:x }))),
      h('label.f', {}, h('span', {}, 'Title'), title)),
    sectionHead('Who is in?', 'Anyone without an account can be added by name.'),
    card(people,
      h('div.row', { style:{ marginTop:'12px' } }, guestName,
        h('button.btn.sm', { style:{ flex:'none' }, async onclick(){
          const n = guestName.value.trim();
          if (!n){ toast('Type a name first.'); return; }
          try {
            const g = await db.addGuest(n);
            await load();
            chosen.add(keyOfGuest(g.id));
            guestName.value = '';
            drawPeople();
            toast(`${g.name} is in`);
          } catch (err){ toast(saveError(err)); }
        } }, 'Add guest')),
      h('p.tiny.muted', { style:{ marginTop:'8px' } },
        'A guest is just a name. They show up in the book and in the all-time totals like everybody else, and if they ever make an account you can keep using the guest until you would rather not.')),
    h('button.btn.pri.wide.big', { style:{ marginTop:'14px' }, async onclick(){
      if (!chosen.size){ toast('Pick at least one person.'); return; }
      const row = { id: uid(), played_on: date.value || today, house: house.value.trim() || HOUSES[0],
        title: title.value.trim() || null, created_by: state.user.id, created_at: new Date().toISOString() };
      try {
        await db.createSession(row, [...chosen].filter(k => !personIsGuest(k))
          .map(k => ({ profile_id: k.slice(2), team:null })));
        /* guests are recorded by their first (zero) line in the book */
        const guests = [...chosen].filter(personIsGuest);
        if (guests.length)
          await db.saveSettlement(row.id, 1, guests.map(k => ({ ...personRow(k), amount_cents:0 })));
        await load();
        openMoneyNight(row.id);
      } catch (err){ toast(saveError(err)); }
    } }, '💵  Start keeping the book'));
  return box;
}

/* "Drew & Nat took it from Tony & Steve" — said in words underneath the game,
   so you can see at a glance whether the numbers you typed mean what you meant. */
function nameList(keys){
  const n = keys.map(personName);
  return n.length < 3 ? n.join(' & ') : n.slice(0, -1).join(', ') + ' & ' + n[n.length - 1];
}
function sidesLine(out){
  const el = h('div.sideline', {});
  if (!out.teams.length) return el;
  if (!out.winners.length || !out.losers.length){
    el.append('Somebody has to be up and somebody down before this reads as a game.');
    return el;
  }
  if (out.headToHead){
    el.append(h('b', {}, nameList(out.teams[0].players)), ' took it from ',
              h('b', {}, nameList(out.teams[1].players)));
  } else {
    /* More than two sides means everybody played for themselves, so saying one
       lot "took it from" the other would put people on teams they were not on. */
    el.append(h('b', {}, nameList(out.winners)), ' came away up \u00b7 ',
              h('b', {}, nameList(out.losers)), ' paid for it');
  }
  if (out.evens.length)
    el.append(' \u00b7 ', h('b', {}, nameList(out.evens)), ' came out level');
  if (out.sat.length) el.append(` \u00b7 ${nameList(out.sat)} sat out`);
  /* Be honest about the limit of the trick rather than quietly inventing
     line-ups: four people on one number might be a four, or two pairs. */
  const vague = out.teams.filter(t => !t.partnership && t.players.length > 3);
  if (vague.length)
    el.append(h('div', { style:{ marginTop:'4px', opacity:'.75' } },
      `Too many on one number to say who was paired with whom, so this game `
      + `counts for the record but not for pairings.`));
  return el;
}

/* Sending the standings to the group chat.

   The chat is iMessage, and Apple has no way for a web page to post into a
   thread — nothing can, so nothing here pretends to. What a phone does give us
   is the share sheet: one tap, pick the thread, send. On a desktop browser
   there is usually no share sheet, so it falls back to the clipboard and says
   which of the two just happened, because a button that silently does nothing
   is worse than no button. */
async function sendToGroup(text){
  if (navigator.share){
    try { await navigator.share({ text }); return; }
    catch (err){
      /* the user backing out of the share sheet is not a failure */
      if (err && err.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(text);
    toast('Copied \u2014 paste it into the chat');
  } catch { toast('This browser will not let a page copy or share.'); }
}

/* The book for one night. A card per game, a line per person, a running total
   that never goes stale, and everything saved the moment you type it. */
function moneyLedger(ses){
  const box = h('div', {});
  const rows = D.moneyBySession.get(ses.id) || [];
  let keys = [...new Set([
    ...(D.rosterOf.get(ses.id) || []).map(p => keyOfProfile(p.profile_id)),
    ...rows.map(personKey),
    ...(D.gamesBySession.get(ses.id) || []).map(g => keyOfProfile(g.profile_id)),
  ])];
  const draft = new Map();
  for (const m of rows) draft.set(m.game_no + '|' + personKey(m), m.amount_cents);
  let games = Math.max(1, ...rows.map(m => m.game_no || 1),
                       Number(localStorage.getItem(gameCountKey(ses.id))) || 1);
  /* Two different noughts. `raw` is null when there is no row at all — that
     person was not in this game — and 0 when there is a row saying they came
     out level. `cell` is for adding up, where both are worth nothing. */
  const raw  = (n, k) => { const v = draft.get(n + '|' + k); return v == null ? null : v; };
  const cell = (n, k) => raw(n, k) || 0;
  const setCell = (n, k, v) => v == null ? draft.delete(n + '|' + k) : draft.set(n + '|' + k, v);
  const totalFor = k => { let t = 0; for (let n = 1; n <= games; n++) t += cell(n, k); return t; };

  /* What actually goes in the message. Plain lines, no attempt at columns —
     iMessage is not monospaced and padded spaces come out ragged. */
  function standingsText(){
    const rows = [...keys].map(k => ({ k, t: totalFor(k) })).sort((a, b) => b.t - a.t);
    const played = nightRounds().length;
    return [
      `\u{1f3b3} ${ses.house}${ses.title ? ' \u00b7 ' + ses.title : ''}`,
      played ? `After ${played} game${played === 1 ? '' : 's'}:` : 'Just getting started:',
      '',
      ...rows.map(r => `${personName(r.k)}  ${money(r.t)}`),
    ].join('\n');
  }
  function finalText(){
    const nets = {};
    for (const k of keys) nets[k] = totalFor(k);
    const moves = B.settleUp(nets);
    const up = writeUpOf(ses);
    return [
      standingsText().replace(/^After /m, 'Final, after '),
      ...(moves.length ? ['', 'Square up:',
        ...moves.map(m => `${personName(m.from)} \u2192 ${personName(m.to)} ${moneyFlat(m.cents)}`)] : []),
      ...(up ? ['', up.headline] : []),
    ].join('\n');
  }

  /* Big enough to hold up and read off when somebody asks. */
  function whosUp(){
    const rows = [...keys].map(k => ({ k, t: totalFor(k) }))
      .sort((a, b) => b.t - a.t);
    openSheet('Who is up', body => {
      const grid = h('div.bigup', {});
      let crossed = false;
      for (const r of rows){
        /* one line between the people who are up and the people who are not */
        if (!crossed && r.t < 0){ crossed = true; grid.append(h('div.sep', {})); }
        grid.append(
          h('div.row', {}, h('span.nm', {}, personName(r.k)),
            /* taking somebody out of the night lives here rather than on the
               strip: it is rare, it is not undoable, and the strip is now one
               big tap target for reading the totals out */
            h('button.rm', { style:{ width:'26px', height:'26px', fontSize:'13px' },
              'aria-label': 'Remove ' + personName(r.k),
              async onclick(e){
                e.stopPropagation();
                if (!confirm(`Take ${personName(r.k)} out of this night? `
                  + 'Their lines for tonight go with them.')) return;
                try {
                  await removeFromNight(ses.id, r.k);
                  keys = keys.filter(x => x !== r.k);
                  for (let n = 1; n <= games; n++) draft.delete(n + '|' + r.k);
                  closeSheet(); drawTotals(); drawGames();
                } catch (err){ toast(saveError(err)); }
              } }, '\u2715')),
          h('div.amt', { cls: r.t > 0 ? 'up' : r.t < 0 ? 'dn' : 'lv' }, money(r.t)));
      }
      body.append(grid);
      const off = rows.reduce((a, r) => a + r.t, 0);
      if (off !== 0) body.append(h('p.tiny.gold', { style:{ marginTop:'14px' } },
        `The book is off by ${money(off)} — somewhere a game does not add up to zero.`));
      body.append(h('button.btn.pri.wide', { style:{ marginTop:'16px' },
        onclick(){ sendToGroup(standingsText()); } }, '\u{1f4f2}  Send to the group'));
    }, `${games} game${games === 1 ? '' : 's'} so far`);
  }

  const strip = h('div.moneystrip.stick', { role:'button', tabindex:'0',
    'aria-label':'Who is up',
    onclick(e){ if (!e.target.closest('.rm')) whosUp(); },
    onkeydown(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); whosUp(); } } });
  let drawTotals = function(){
    clear(strip);
    strip.append(h('div.whoup', {}, 'Who is up',
      h('span.more', {}, 'tap for the big version')));
    for (const k of [...keys].sort((a,b) => totalFor(b) - totalFor(a))){
      const t = totalFor(k);
      strip.append(h('span.chip', {}, personName(k), ' ', moneyPill(t)));
    }
    const bal = keys.reduce((s, k) => s + totalFor(k), 0);
    if (bal !== 0) strip.append(h('span.chip', { style:{ borderColor:'rgba(201,133,0,.5)' } },
      h('span.tiny.gold', {}, `off by ${money(bal)}`)));
  };
  async function save(n){
    pending.delete(n);
    const payload = keys.filter(k => raw(n, k) != null)
                        .map(k => ({ ...personRow(k), amount_cents: raw(n, k) }));
    try { await db.saveSettlement(ses.id, n, payload); await load(); }
    catch (err){ toast(saveError(err)); }
  }
  /* A number used to be written down when you tapped away from the box. That is
     almost always immediately — but if you typed the last figure of the night
     and locked your phone without tapping anything, it went nowhere. So it also
     saves shortly after you stop typing, and again the moment the page is being
     hidden, which is what a lock, an app switch or a close actually look like. */
  const pending = new Set();
  let typingTimer = null;
  function saveSoon(n){
    pending.add(n);
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => { for (const g of [...pending]) save(g); }, 700);
  }
  function flushNow(){
    clearTimeout(typingTimer);
    for (const g of [...pending]) save(g);
  }
  document.addEventListener('visibilitychange', flushNow);
  window.addEventListener('pagehide', flushNow);

  /* What actually gets typed, week in week out. Four buttons beats a number
     pad, and the keyboard covering half the screen is most of why keeping the
     book on a phone is annoying. */
  const QUICK = [-1000, -500, 0, 500, 1000];
  const quickKey = 'bowl.money.quickamt';
  let quickAmounts = (() => {
    try { return localStorage.getItem(quickKey) !== '0'; } catch { return true; }
  })();

  function gameCard(n){
    const cardEl = h('div.card.gamecard', {});
    const marks = new Map();
    let stake = Number(localStorage.getItem('bowl.stake')) || 500;
    let showQuick = false;

    function drawCard(){
      clear(cardEl);
      cardEl.append(h('div.spread', {},
        h('div.up', {}, 'Game ' + n),
        h('div.row', {},
          h('button.btn.sm' + (quickAmounts ? '.on' : ''), {
            'aria-pressed': String(quickAmounts),
            onclick(){
              quickAmounts = !quickAmounts;
              try { localStorage.setItem(quickKey, quickAmounts ? '1' : '0'); } catch {}
              drawGames();
            } }, '\u26a1'),
          h('button.btn.sm', { onclick(){ showQuick = !showQuick; drawCard(); } }, 'Quick fill'),
          h('button.rm', { 'aria-label':'Clear game ' + n, async onclick(){
            if (!confirm(`Clear game ${n}? Everything typed for it goes.`)) return;
            const ids = state.money.filter(m => m.session_id === ses.id && m.game_no === n).map(m => m.id);
            try {
              await db.deleteMoneyRows(ids);
              await load();
              for (const k of keys) draft.delete(n + '|' + k);
              if (n === games && games > 1){ games--; localStorage.setItem(gameCountKey(ses.id), games); }
              drawTotals(); drawGames();
            } catch (err){ toast(saveError(err)); }
          } }, '✕'))));

      if (showQuick){
        const q = h('div', { style:{ marginTop:'10px' } },
          h('p.tiny.muted', {}, 'Tap each name until it says what they did, pick the stake, then fill.'));
        const tags = h('div.row.wrapf', { style:{ marginTop:'8px' } });
        for (const k of keys){
          const m = marks.get(k) || '';
          tags.append(h('button.chip' + (m === 'W' ? '.on' : ''), {
            style: m === 'L' ? { borderColor:'rgba(230,103,103,.6)', color:'var(--red)' } : {},
            onclick(){
              const order = ['', 'W', 'L'];
              marks.set(k, order[(order.indexOf(m) + 1) % 3]);
              drawCard();
            } }, `${personName(k)} ${m === 'W' ? 'won' : m === 'L' ? 'lost' : '·'}`));
        }
        q.append(tags);
        q.append(h('div.row.wrapf', { style:{ marginTop:'8px' } }, STAKES.map(v =>
          h('button.chip' + (v === stake ? '.on' : ''), { onclick(){
            stake = v; localStorage.setItem('bowl.stake', v); drawCard();
          } }, moneyFlat(v)))));
        q.append(h('div.grid2', { style:{ marginTop:'10px' } },
          h('button.btn.sm', { onclick(){ fill('pot'); } }, 'Winners split the pot'),
          h('button.btn.sm', { onclick(){ fill('flat'); } }, `Flat ${moneyFlat(stake)} each`)));
        cardEl.append(q);
      }

      /* The sides are not typed in. They are read off the numbers as they are
         typed: same amount, same side; up means that side took the game. */
      const out = B.teamsFromMoney(keys.filter(k => raw(n, k) != null)
                                       .map(k => ({ key:k, cents: raw(n, k) })));
      const sideOf = k => out.teams.find(t => t.players.includes(k)) || null;

      const led = h('div', { style:{ marginTop:'10px' } });
      for (const k of keys){
        const v = raw(n, k);
        const t = sideOf(k);
        /* An empty box is not in this game. A nought is in it and level. */
        const read = e => e.target.value.trim() === ''
          ? null : Math.round(Number(e.target.value) * 100);
        const input = h('input.n', { type:'number', step:'0.5',
          value: v == null ? '' : (v / 100).toFixed(2).replace(/\.00$/, ''),
          placeholder:'\u2013',
          /* the running totals move as you type; the write-down follows a
             moment later so it is not one request per keystroke */
          oninput(e){ setCell(n, k, read(e)); drawTotals(); saveSoon(n); },
          onchange(e){ setCell(n, k, read(e)); drawTotals(); save(n); drawCard(); } });
        led.append(h('div.led', {},
          h('span.side', { 'data-t': t ? t.letter : '' }, t ? t.letter : '–'),
          h('div.who', {}, personName(k), personIsGuest(k) ? h('span.tiny.muted', {}, ' guest') : null),
          h('span.tiny', { cls: t ? (t.won ? 'good' : t.lost ? 'bad' : 'muted') : 'muted' },
            t ? (t.won ? 'won' : t.lost ? 'lost' : 'level')
              : (v == null ? 'not in it' : 'level')),
          h('div.amt', {}, input)));
        if (quickAmounts)
          led.append(h('div.quickamt', {}, QUICK.map(cents =>
            h('button' + (v === cents ? '.on' : '') + (cents === 0 ? '.zero' : ''), {
              'aria-label': `${personName(k)} ${cents === 0 ? 'level' : money(cents)}`,
              onclick(){
                /* tapping the one already showing takes them back out of the
                   game, so a mis-tap is one tap to undo rather than a trip to
                   the keyboard. The dash is its own thing: level. */
                setCell(n, k, v === cents ? null : cents);
                drawTotals(); save(n); drawCard();
              } },
              cents === 0 ? '\u2013' : (cents > 0 ? '+' : '\u2212') + Math.abs(cents / 100)))));
      }
      cardEl.append(led);
      cardEl.append(sidesLine(out));
      const sum = keys.reduce((s, k) => s + cell(n, k), 0);
      if (sum !== 0) cardEl.append(h('div.balwarn', {}, `This game adds up to ${money(sum)}, not zero.`));
    }
    function fill(mode){
      const W = keys.filter(k => marks.get(k) === 'W');
      const L = keys.filter(k => marks.get(k) === 'L');
      if (!W.length || !L.length){ toast('Mark at least one winner and one loser.'); return; }
      let amounts;
      if (mode === 'pot'){
        amounts = B.settle([{ team:'W', players:W, total:1 }, { team:'L', players:L, total:0 }],
                           { stake, structure:'winner' }).amounts;
      } else {
        amounts = {};
        W.forEach(k => amounts[k] = stake);
        L.forEach(k => amounts[k] = -stake);
      }
      /* Nobody marked either way was not in this game, so they get no row
         rather than a nought that would read as coming out level. */
      for (const k of keys)
        setCell(n, k, marks.get(k) ? (amounts[k] || 0) : null);
      drawTotals(); save(n); drawCard();
    }
    drawCard();
    return cardEl;
  }

  const list = h('div', {});
  function drawGames(){
    clear(list);
    for (let n = 1; n <= games; n++) list.append(gameCard(n));
    list.append(h('button.btn.wide', { style:{ marginTop:'6px' }, onclick(){
      games++; localStorage.setItem(gameCountKey(ses.id), games); drawGames(); drawTotals();
    } }, '＋  Another game'));
  }

  box.append(flowHead(dateLabel(ses.played_on), `${ses.house}${ses.title ? ' · ' + ses.title : ''}`,
    () => { closeMoneyNight(); go('home'); },
    'Home',
    h('button.btn.sm', { onclick(){ closeMoneyNight(); } }, 'Done')));
  drawTotals();
  box.append(strip);

  /* The same two things are on the big totals view, but only if you knew to
     tap the strip to find it — which nobody does. So they are also here, in
     plain sight, at the top of the night where you are when somebody asks. */
  box.append(h('div.grid2', { style:{ margin:'2px 0 10px' } },
    h('button.btn', { onclick(){ whosUp(); } }, '\u{1f440}  Who is up'),
    h('button.btn', { onclick(){ sendToGroup(standingsText()); } }, '\u{1f4f2}  Send to the group')));

  if (canReadPhotos()){
    box.append(h('button.btn.wide', { style:{ margin:'4px 0 10px' }, onclick(){
      photoSheet({
        mode:'money',
        people: keys.map(k => ({ key:k, name: personName(k) })),
        async onApply(rows){
          const touchedGames = new Set();
          for (const r of rows){
            r.values.forEach((v, i) => {
              const n = i + 1;
              if (n > games){ games = n; localStorage.setItem(gameCountKey(ses.id), games); }
              draft.set(n + '|' + r.match.key, Math.round(v * 100));
              touchedGames.add(n);
            });
          }
          for (const n of touchedGames) await save(n);
          drawTotals(); drawGames();
          toast('Read in — check it over');
        },
      });
    } }, '📷  Read it off a photo'));
  }

  const gname = h('input', { type:'text', placeholder:'someone else’s name' });
  box.append(h('div.row', { style:{ margin:'10px 0' } }, gname,
    h('button.btn.sm', { style:{ flex:'none' }, async onclick(){
      const n = gname.value.trim();
      if (!n){ toast('Type a name first.'); return; }
      try {
        const g = await db.addGuest(n);
        await load();
        const k = keyOfGuest(g.id);
        if (!keys.includes(k)) keys.push(k);
        gname.value = '';
        await save(1);
        drawTotals(); drawGames();
        toast(`${g.name} is in`);
      } catch (err){ toast(saveError(err)); }
    } }, 'Add somebody')));

  drawGames();
  box.append(list);

  /* ---- finishing the night ------------------------------------------
     Finishing does not lock anything — you can still fix a number after,
     and everything below re-reads itself when you do. It only means "we
     are done, tell me what happened". */
  function nightRounds(){
    const out = [];
    for (let n = 1; n <= games; n++){
      const r = B.teamsFromMoney(keys.map(k => ({ key:k, cents: cell(n, k) })));
      if (r.teams.length) out.push({ game_no:n, ...r });
    }
    return out;
  }
  function nightTally(){
    const tally = new Map();
    for (const r of nightRounds())
      for (const t of r.teams) for (const k of t.players){
        const e = tally.get(k) || { key:k, won:0, lost:0, even:0 };
        if (t.won) e.won++; else if (t.lost) e.lost++; else e.even++;
        tally.set(k, e);
      }
    return [...tally.values()].map(e => ({ ...e, net: totalFor(e.key) }))
      .sort((a,b) => (b.won - b.lost) - (a.won - a.lost) || b.net - a.net);
  }
  function recordCard(){
    const rows = nightTally();
    if (!rows.length) return h('p.empty', {}, 'Type some numbers in and the record writes itself.');
    return h('div.card', {}, rows.map(r => {
      const played = r.won + r.lost + (r.even || 0);
      return h('div.recrow', {},
        h('div', {}, h('div', { style:{ fontWeight:650 } }, personName(r.key),
            personIsGuest(r.key) ? h('span.tiny.muted', {}, ' guest') : null),
          h('div.tiny.muted', {}, `${played} game${played === 1 ? '' : 's'}`)),
        h('div.wbar', {}, h('i', { style:{ width: (played ? (r.won / played) * 100 : 0) + '%' } })),
        h('div.wl', {}, wl(r)),
        moneyPill(r.net));
    }));
  }

  /* Finishing is a fact about the night, not about this phone, so it belongs
     in the database. The column arrives with a migration somebody has to run
     by hand, though, so if it is not there yet this still works — it just only
     knows on the device you pressed it. */
  const doneKey = 'bowl.money.done.' + ses.id;
  const localDone = () => { try { return !!localStorage.getItem(doneKey); } catch { return false; } };
  let finished = !!ses.finished_at || localDone();
  let sharedFinish = !!ses.finished_at;

  async function setFinished(on){
    const when = on ? new Date().toISOString() : null;
    let shared = false;
    try { shared = db.setFinished ? await db.setFinished(ses.id, when) : false; }
    catch (err){ toast(saveError(err)); return; }
    /* Read it back rather than trusting what we just set: loadAll hands out
       copies, so a session mutated in place here would be quietly overwritten
       by the next save. The database is the one that knows. */
    if (shared){
      await load();
      ses.finished_at = D.session.get(ses.id)?.finished_at || null;
    }
    sharedFinish = shared && on;
    /* only lean on this device when the database could not hold it */
    try {
      if (on && !shared) localStorage.setItem(doneKey, when);
      else localStorage.removeItem(doneKey);
    } catch {}
    finished = on;
    drawWrap();
    if (on) wrap.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  const wrap = h('div', {});
  function drawWrap(){
    clear(wrap);
    if (!finished){
      wrap.append(h('button.btn.pri.wide.big', { style:{ marginTop:'16px' }, onclick(){
        if (!nightRounds().length){ toast('Nothing typed in yet.'); return; }
        setFinished(true);
      } }, '\u2713  Finish the session'));
      wrap.append(h('p.tiny.muted', { style:{ marginTop:'8px', textAlign:'center' } },
        'Nothing locks — you can still fix a number afterwards.'));
      return;
    }
    wrap.append(sectionHead("Tonight's record", 'Read off the money. Nobody logged a score.'));
    wrap.append(recordCard());
    wrap.append(recapSection(ses, nightRounds, nightTally));
    wrap.append(h('button.btn.wide', { style:{ marginTop:'12px' },
      onclick(){ setFinished(false); } }, 'Un-finish it'));
    wrap.append(h('p.tiny.muted', { style:{ marginTop:'8px', textAlign:'center' } },
      sharedFinish ? 'Finished. Everybody sees this night as done.'
                   : 'Finished on this device only \u2014 the database has not had '
                   + 'the finished_at column added yet.'));
  }
  drawWrap();
  box.append(wrap);

  /* who hands what to whom, so nobody works it out on a napkin */
  const square = h('div', {});
  function drawSquare(){
    clear(square);
    const nets = {};
    for (const k of keys) nets[k] = totalFor(k);
    const moves = B.settleUp(nets);
    if (!moves.length) return;
    square.append(sectionHead('Square up', 'The fewest handovers that settle everybody.'));
    const rows2 = h('div.card', {}, moves.map(m =>
      h('div.payrow', {}, h('b', {}, personName(m.from)), h('span.arrow', {}, '→'),
        h('b', {}, personName(m.to)), h('b.n', { style:{ marginLeft:'auto' } }, moneyFlat(m.cents)))));
    square.append(rows2);
    square.append(h('button.btn.wide', { style:{ marginTop:'8px' },
      onclick(){ sendToGroup(finalText()); } }, '\u{1f4f2}  Send it to the group'));
  }

  const _drawTotals = drawTotals;
  drawTotals = function(){ _drawTotals(); drawSquare(); if (finished) drawWrap(); };
  drawTotals();
  box.append(square);
  box.append(h('p.tiny.muted', { style:{ marginTop:'10px' } },
    'Saved as you type. This night stays in the book — open it again any time from the Money tab.'));

  /* Binning a night used to mean backing out to the Tonight tab and finding
     the right ✕ in a list. If it is the night in front of you, it should be
     binnable from the night in front of you. */
  box.append(h('button.btn.wide', { style:{ marginTop:'14px' }, async onclick(){
    if (!confirm(`Put the night of ${dateLabel(ses.played_on)} away?`
      + '\n\nIt comes out of the book and out of everybody\u2019s totals. '
      + 'Nothing is destroyed \u2014 it sits in the archive and you can bring it back.')) return;
    try {
      try { localStorage.removeItem('bowl.money.night'); } catch {}
      closeMoneyNight();
      await setArchived(ses.id, true);
      toast('Put away. It is in the archive.');
      go('tonight');
    } catch (err){ toast(saveError(err)); }
  } }, '\u{1f4e6}  Put this night away'));

  box.append(glossary(MONEY_GLOSS));
  return box;
}

/* Take somebody out of one night: their lines go, and if they have an account
   they come off the roster too so they do not reappear. */
async function removeFromNight(sessionId, key){
  const ids = state.money.filter(m => m.session_id === sessionId && personKey(m) === key).map(m => m.id);
  await db.deleteMoneyRows(ids);
  if (!personIsGuest(key)) await db.removeSessionPlayer(sessionId, key.slice(2));
  await load();
}
/* Fold a guest's whole history into a real account, for when they finally
   sign up. Lines that would collide on the same game are added together. */
async function mergeGuestInto(guestId, profileId){
  const rows = state.money.filter(m => m.guest_id === guestId);
  const kill = [];
  for (const r of rows){
    const clash = state.money.find(m => m.profile_id === profileId
      && m.session_id === r.session_id && m.game_no === r.game_no);
    if (clash){
      await db.updateMoneyRow(clash.id, { amount_cents: clash.amount_cents + r.amount_cents });
      kill.push(r.id);
    } else {
      await db.updateMoneyRow(r.id, { profile_id: profileId, guest_id: null });
    }
  }
  if (kill.length) await db.deleteMoneyRows(kill);
  await db.deleteGuest(guestId);
  await load();
}

/* ======================================================================
   READING A PHOTO
   The picture goes to a Supabase function that holds the API key; what comes
   back is a draft you look at and correct. Nothing is saved until you say so.
   ====================================================================== */
const canReadPhotos = () => !!(window.__PARSE_STUB || (db && db.kind === 'live' && CONFIGURED));

async function readPhoto(mode, file, people){
  if (window.__PARSE_STUB) return window.__PARSE_STUB;
  const data = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(new Error('Could not open that file.'));
    r.readAsDataURL(file);
  });
  let token = SUPA.anonKey;
  try { const { data: sess } = await db.sb.auth.getSession(); token = sess?.session?.access_token || token; } catch {}
  const res = await fetch(`${SUPA.url}/functions/v1/parse-photo`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey: SUPA.anonKey, Authorization: `Bearer ${token}` },
    body: JSON.stringify({ mode, media_type: file.type || 'image/jpeg', data, people: people.map(p => p.name) }),
  });
  if (res.status === 404) throw new Error('The photo reader is not set up on this site yet — the README says how, it takes about ten minutes.');
  let out = {};
  try { out = await res.json(); } catch {}
  if (!res.ok || out.error) throw new Error(out.error || `The reader answered ${res.status}.`);
  return out;
}
/* Match what is written on the page to somebody we know about. */
function matchPerson(written, people){
  const n = String(written || '').trim().toLowerCase();
  if (!n) return null;
  return people.find(p => p.name.toLowerCase() === n)
      || people.find(p => p.name.toLowerCase().startsWith(n) || n.startsWith(p.name.toLowerCase()))
      || people.find(p => p.name[0].toLowerCase() === n[0] && n.length <= 3)
      || null;
}

/* The note comes back from a language model, so now and then it is not a
   sentence at all but a stray tag or a fragment. Show it only if it reads like
   something a person wrote. */
function cleanNote(note){
  const s = String(note || '').replace(/<[^>]*>/g, '').trim();
  if (s.length < 4 || !/[a-z]{3}/i.test(s)) return '';
  return s.slice(0, 300);
}

/* ======================================================================
   WRITING THE NIGHT UP
   The facts go to a Supabase function that holds the API key, and a few
   paragraphs come back. It is written from the money and the sides read off
   it — no score is involved, and none is needed.
   ====================================================================== */
const canWriteUp = () => !!(window.__RECAP_STUB || (db && db.kind === 'live' && CONFIGURED));
const recapKey = sid => 'bowl.money.recap.' + sid;

/* Everybody's record BEFORE tonight, which is where "has now lost seven
   straight" comes from. Without it the write-up can only describe one night. */
function formGoingIn(sid, keys){
  const out = {};
  for (const k of keys) out[k] = { won:0, lost:0, net:0, streak:0 };
  for (const r of D.moneyRounds){
    if (r.session_id === sid) continue;
    for (const t of r.teams) for (const k of t.players){
      if (!out[k]) continue;
      if (t.won) out[k].won++; else out[k].lost++;
    }
  }
  for (const m of state.money){
    if (m.session_id === sid) continue;
    const k = personKey(m);
    if (out[k]) out[k].net += m.amount_cents;
  }
  return out;
}

async function writeUpNight(payload){
  if (window.__RECAP_STUB) return window.__RECAP_STUB;
  let token = SUPA.anonKey;
  try { const { data: sess } = await db.sb.auth.getSession(); token = sess?.session?.access_token || token; } catch {}
  const res = await fetch(`${SUPA.url}/functions/v1/write-recap`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey: SUPA.anonKey, Authorization: `Bearer ${token}` },
    body: JSON.stringify(payload),
  });
  if (res.status === 404) throw new Error('The write-up function is not deployed yet \u2014 '
    + 'run  supabase functions deploy write-recap  and it will start working.');
  let out = {};
  try { out = await res.json(); } catch {}
  if (!res.ok || out.error) throw new Error(out.error || `The writer answered ${res.status}.`);
  return out;
}

/* The write-up, and the button that asks for one. Written once when you
   finish, then it just sits there until you ask for another. */
function recapSection(ses, nightRounds, nightTally){
  const box = h('div', {});
  box.append(sectionHead('The night, written up', 'From the money. No scores involved.'));
  const slot = h('div', {});
  box.append(slot);

  const cached = (() => {
    try { return JSON.parse(localStorage.getItem(recapKey(ses.id)) || 'null'); } catch { return null; }
  })();
  function localWriteUp(){
    return B.writeUp({
      played_on: ses.played_on, house: ses.house, title: ses.title,
      totals: nightTally().map(t => ({ ...t, name: personName(t.key) })),
      rounds: nightRounds().map(r => ({ ...r,
        teams: r.teams.map(t => ({ ...t, players: t.players.map(personName) })) })),
      goingIn: formGoingIn(ses.id, nightTally().map(t => t.key)),
    });
  }

  function show(recap, byClaude){
    clear(slot);
    slot.append(h('div.art', {},
      h('div.kicker', {}, `${dateLabel(ses.played_on)} \u00b7 ${ses.house}`),
      h('h3', {}, recap.headline || 'The night'),
      h('div.byline', {}, byClaude
        ? 'Written from the money book. Nobody logged a score.'
        : 'Read straight off the money book.'),
      (recap.story || []).map(para => h('p', {}, para))));
    /* The write-up above needs nothing but the numbers. This asks Claude for a
       longer one, and only appears if the function has actually been deployed. */
    if (!canWriteUp()) return;
    slot.append(h('button.btn.wide', { style:{ marginTop:'10px' }, async onclick(e){
      const btn = e.currentTarget;
      btn.disabled = true; btn.textContent = 'Writing\u2026';
      try {
        const tally = nightTally();
        const keys = tally.map(t => t.key);
        const payload = {
          played_on: ses.played_on, house: ses.house, title: ses.title || null,
          people: Object.fromEntries(keys.map(k => [k, personName(k)])),
          games: nightRounds().map(r => ({
            game_no: r.game_no,
            sides: r.teams.map(t => ({ names: t.players.map(personName), amount: t.cents / 100, won: t.won })),
            sat_out: r.sat.map(personName),
          })),
          totals: tally.map(t => ({ name: personName(t.key), won:t.won, lost:t.lost, net: t.net / 100 })),
          going_in: Object.entries(formGoingIn(ses.id, keys)).map(([k, v]) =>
            ({ name: personName(k), won:v.won, lost:v.lost, net: v.net / 100 })),
        };
        const longer = await writeUpNight(payload);
        try { localStorage.setItem(recapKey(ses.id), JSON.stringify(longer)); } catch {}
        show(longer, true);
      } catch (err){
        btn.disabled = false;
        btn.textContent = '\u2728  Ask Claude for a longer one';
        toast(err.message || String(err));
      }
    } }, '\u2728  Ask Claude for a longer one'));
  }
  show(cached || localWriteUp(), !!cached);
  return box;
}

function photoSheet({ mode, people, onApply, title }){
  openSheet(title || (mode === 'money' ? 'Read the notes' : 'Read the monitor'), body => {
    /* No `capture` attribute on purpose: with it, a phone goes straight to the
       camera and the camera roll is unreachable. Without it you get the whole
       sheet — Photo Library, Take Photo, Choose File — which is what people
       usually want, because the photo was taken an hour ago. */
    const file = h('input', { type:'file', accept:'image/*', style:{ display:'none' } });
    const preview = h('div', {});
    const out = h('div', {});
    const pick = h('button.btn.pri.wide.big', { onclick(){ file.click(); } }, '📷  Take or choose a photo');

    body.append(h('p.small.ink2', { style:{ margin:'14px 0' } }, mode === 'money'
      ? 'A photo of the notes page you keep the money on. It reads the names and the numbers and shows you what it thinks before anything is saved.'
      : 'A photo of the monitor above the lane. It reads each bowler’s final total for each game and shows you what it thinks before anything is saved.'),
      pick, file, preview, out);

    file.onchange = async () => {
      const f = file.files && file.files[0];
      if (!f) return;
      clear(out);
      clear(preview);
      preview.append(h('img', { src: URL.createObjectURL(f), alt:'',
        style:{ width:'100%', borderRadius:'14px', margin:'14px 0', border:'1px solid var(--ring)' } }));
      out.append(h('p.small.muted', {}, 'Reading it…'));
      try {
        const res = await readPhoto(mode, f, people);
        clear(out);
        const rows = (res.people || []).map(p => ({
          written: p.name, match: matchPerson(p.name, people), values: p.values || [],
        }));
        if (!rows.length){
          out.append(h('p.empty', {}, cleanNote(res.note) || 'Nothing readable in that one. Try again straight on, with the whole thing in frame.'));
          return;
        }
        /* Only a genuine lack of confidence raises the warning. The note is
           extra detail when there is one, never the trigger — a stray token in
           it used to put "check these" over a read that was perfectly fine,
           which teaches people to ignore the one banner that matters. */
        if (!res.confident)
          out.append(h('div.card', { style:{ borderColor:'rgba(201,133,0,.5)' } },
            h('div.up.gold', {}, 'Not sure about this one'),
            h('p.small.ink2', { style:{ marginTop:'4px' } }, cleanNote(res.note) || 'Some of these were hard to read. Check them.')));

        out.append(sectionHead('What it read', 'Change anything that is wrong, then use it.'));
        for (const r of rows){
          const sel = h('select', {}, h('option', { value:'' }, '— skip —'),
            people.map(p => h('option', { value:p.key, selected: r.match && r.match.key === p.key }, p.name)));
          sel.onchange = () => { r.match = people.find(p => p.key === sel.value) || null; };
          const boxes = h('div.row.wrapf', { style:{ marginTop:'8px' } });
          r.values.forEach((v, i) => {
            const inp = h('input.n', { type:'number', step: mode === 'money' ? '0.5' : '1', value:v,
              style:{ width:'84px' }, onchange(e){ r.values[i] = Number(e.target.value); } });
            boxes.append(inp);
          });
          out.append(h('div.card', {},
            h('div.spread', {}, h('div', { style:{ fontWeight:650 } }, r.written),
              h('span.tiny.muted', {}, `${r.values.length} number${r.values.length === 1 ? '' : 's'}`)),
            h('div', { style:{ marginTop:'8px' } }, sel), boxes));
        }
        out.append(h('button.btn.pri.wide.big', { style:{ marginTop:'14px' }, async onclick(){
          const use = rows.filter(r => r.match && r.values.length);
          if (!use.length){ toast('Nothing to use — match at least one name.'); return; }
          try { await onApply(use); closeSheet(); }
          catch (err){ toast(saveError(err)); }
        } }, 'Use these numbers'));
        out.append(h('p.tiny.muted', { style:{ marginTop:'8px', textAlign:'center' } },
          'It reads a photo well but not perfectly. Whatever you confirm here is what gets saved.'));
      } catch (err){
        clear(out);
        out.append(h('div.card', { style:{ borderColor:'rgba(230,103,103,.5)' } },
          h('div.up', { style:{ color:'var(--red)' } }, 'Could not read it'),
          h('p.small.ink2', { style:{ marginTop:'4px' } }, err.message || String(err))));
      }
    };
  });
}

/* ---- money: all time, and every night that came before ---- */
function tabMoney(){
  const box = h('div', {});
  if (state.staleSchema) box.append(staleSchemaCard());
  const keys = [...new Set(state.money.map(personKey))];
  const rows = keys.map(moneySummaryKey).filter(r => r.nights > 0);
  box.append(sectionHead('The book', 'Every night ever settled, added up.'));

  if (!rows.length){
    box.append(h('p.empty', {}, 'Nothing in the book yet. Start a night on the Tonight tab and keep it as you go.'));
    if (state.user) box.append(h('button.btn.pri.wide.big', { onclick(){ go('tonight'); } }, '💵  Start a night'));
    box.append(glossary(MONEY_GLOSS));
    return box;
  }
  const ranked = [...rows].sort((a, b) => b.net - a.net);
  const top = ranked[0], bottom = ranked[ranked.length - 1];
  const mine = state.user ? rows.find(r => r.key === keyOfProfile(state.user.id)) : null;
  const moved = state.money.filter(m => m.amount_cents > 0).reduce((a, m) => a + m.amount_cents, 0);
  box.append(tiles([
    tile('Up the most', money(top.net), top.name),
    tile('Down the most', money(bottom.net), bottom.name),
    mine ? tile('You', money(mine.net), `${mine.up} up, ${mine.down} down`)
         : tile('Nights', int(new Set(state.money.map(m => m.session_id)).size), 'with money on them'),
    tile('Changed hands', moneyFlat(moved), 'all time'),
  ]));
  box.append(h('div.card', {}, divergingBars(ranked.map(r => ({
    label: r.name, value: r.net / 100,
    tipText: `${r.name}: ${money(r.net)} over ${r.nights} night${r.nights === 1 ? '' : 's'}`,
  })))));
  box.append(h('div.card.pad0', {}, sortTable({
    initial:'net', dir:-1, cardMain:'net',
    onRow: r => { if (!r.guest) showBowler(r.key.slice(2)); },
    cols:[
      { key:'name', label:'Person', text:true, value:r => r.name,
        cell:r => h('div.row', {}, r.profile ? avatar(r.profile) : nameChip(r.name),
          h('span', { style:{ fontWeight:650 } }, r.name),
          r.guest ? h('span.tiny.muted', {}, 'guest') : null) },
      { key:'net', label:'Net', value:r => r.net, cell:r => moneyPill(r.net) },
      { key:'nights', label:'Nights', value:r => r.nights },
      { key:'best', label:'Best night', value:r => r.best, fmt:v => money(v) },
      { key:'worst', label:'Worst night', value:r => r.worst, fmt:v => money(v) },
      { key:'per', label:'Per night', value:r => r.perNight, fmt:v => money(Math.round(v)) },
    ], rows,
  })));

  const who = mine || top;
  const cum = [];
  let run = 0;
  for (const n of who.list){ run += n.cents; cum.push({ x: shortDate(n.played_on), y: run / 100 }); }
  if (cum.length > 1){
    box.append(sectionHead(`${who.name} over time`, 'Running total, in dollars.'));
    box.append(h('div.card', {}, lineChart(cum, { label:'dollars' })));
  }

  /* Adding, renaming, merging and deleting people all live on the People tab
     now. They were here as well, which meant two places to keep in step and
     one of them at the bottom of a page nobody scrolls. */

  box.append(sectionHead('Night by night', 'Tap one to open its book again.'));
  const bySession = new Map();
  for (const m of state.money){
    if (!bySession.has(m.session_id)) bySession.set(m.session_id, []);
    bySession.get(m.session_id).push(m);
  }
  const nights = [...bySession.entries()]
    .map(([sid, ms]) => ({ ses: D.session.get(sid), sid, ms }))
    .filter(n => n.ses)
    .sort((a, b) => b.ses.played_on.localeCompare(a.ses.played_on));
  for (const n of nights){

    for (const m of n.ms) net.set(personKey(m), (net.get(personKey(m)) || 0) + m.amount_cents);

        [...net.entries()].sort((a,b) => b[1] - a[1]).map(([k, c]) =>

  box.append(glossary(MONEY_GLOSS));
  return box;
}

function powerInput(st){

    avg: st.avg, firstBall: st.firstBall, sparePct: st.sparePct,
    strikePct: st.strikePct, sd: st.sd,
    form: (st.last10avg != null && st.avg != null) ? st.last10avg - st.avg : null,

function powerBreakdown(r){

function subStats(games){
  const scores = games.map(g => g.total_score);
  const per = games.filter(g => g.entry_mode !== 'quick' && g.rolls.length).map(g => B.gameStats(g.rolls));
  const roll = B.mergeStats(per);
  return {
    games: games.length, scores, avg: B.mean(scores), sd: B.stdev(scores),
    high: scores.length ? Math.max(...scores) : null, c200: scores.filter(v => v >= 200).length,
    clean: roll.clean, roll,
    sparePct: B.pct(roll.spares, roll.spareChances),
    strikePct: B.pct(roll.strikes, roll.firstBalls),
    firstBall: roll.firstBalls ? roll.firstBallPins / roll.firstBalls : null,
    tenthAvg: roll.tenthGames ? roll.tenthPins / roll.tenthGames : null,
  };
}
/* Longest run of strikes inside one session, across game boundaries. */
function sessionStreaks(){
  const out = [];
  for (const ses of D.sessions){
    for (const line of ses.lines){
      let run = 0, best = 0;
      for (const g of line.games){
        if (g.entry_mode === 'quick'){ run = 0; continue; }
        const sofar = [];
        for (const r of B.ordered(g.rolls)){
          const st = B.deckState(sofar); sofar.push(r);
          if (!st.fullRack) continue;
          if (B.fell(r) === 10){ run++; best = Math.max(best, run); } else run = 0;
        }
      }
      if (best) out.push({ id: line.id, name: line.name, best, session: ses });
    }
  }
  return out.sort((a,b) => b.best - a.best);
}
function records(){
  const R = {};
  R.highGame = D.games.reduce((a,g) => !a || g.total_score > a.total_score ? g : a, null);
  const withStats = [...D.stats.values()].filter(s2 => s2.games);
  R.best3 = withStats.map(s2 => ({ s:s2, v:s2.best3 })).filter(x => x.v != null).sort((a,b) => b.v - a.v)[0] || null;
  R.best4 = withStats.map(s2 => ({ s:s2, v:s2.best4 })).filter(x => x.v != null).sort((a,b) => b.v - a.v)[0] || null;
  R.series = withStats.map(s2 => ({ s:s2, v:s2.highSeries })).filter(x => x.v != null).sort((a,b) => b.v - a.v)[0] || null;
  let mostStrikes = null;
  for (const g of D.games){
    if (g.entry_mode === 'quick' || !g.rolls.length) continue;
    const gs = B.gameStats(g.rolls);
    if (!mostStrikes || gs.strikes > mostStrikes.n) mostStrikes = { g, n: gs.strikes };
  }
  R.mostStrikes = mostStrikes;
  R.streak = sessionStreaks()[0] || null;
  R.games = withStats.slice().sort((a,b) => b.games - a.games)[0] || null;
  R.c200 = withStats.slice().sort((a,b) => b.c200 - a.c200)[0] || null;
  R.perfect = D.games.filter(g => g.total_score === 300).sort((a,b) => a.played_on.localeCompare(b.played_on))[0] || null;
  let spare = null, improve = null;
  for (const ses of D.sessions){
    for (const line of ses.lines){
      const pins = line.games.filter(g => g.entry_mode !== 'quick' && g.rolls.length);
      if (pins.length){
        const m = B.mergeStats(pins.map(g => B.gameStats(g.rolls)));
        if (m.spareChances >= 5){
          const v = B.pct(m.spares, m.spareChances);
          if (!spare || v > spare.v) spare = { v, line, ses };
        }
      }
      if (line.games.length >= 2){
        const d = line.games[line.games.length-1].total_score - line.games[0].total_score;
        if (!improve || d > improve.d) improve = { d, line, ses };
      }
    }
  }
  R.spare = spare; R.improve = improve;
  return R;
}
const AWARDS = [
  ['The Machine',      'highest average',            s2 => s2.avg,        one,  'max'],
  ['Mr. Consistent',   'smallest gap between games', s2 => s2.sd,         one,  'min'],
  ['Boom or Bust',     'biggest gap between games',  s2 => s2.sd,         one,  'max'],
  ['Spare Change',     'best spare conversion',      s2 => s2.sparePct,   pc,   'max'],
  ['Pocket Watch',     'best first ball',            s2 => s2.firstBall,  one,  'max'],
  ['Iron Lung',        'most games bowled',          s2 => s2.games,      int,  'max'],
  ['Clutch',           'best 10th frame',            s2 => s2.tenthAvg,   one,  'max'],

];
/* Records anybody can hold, guests included, because they come off the money
   rather than off a score sheet nobody fills in. */
function moneyRecords(){
  const byNight = new Map();
  for (const m of state.money){
    const k = personKey(m) + '|' + m.session_id;
    byNight.set(k, (byNight.get(k) || 0) + m.amount_cents);
  }
  let bestNight = null, worstNight = null;
  for (const [k, cents] of byNight){
    const cut = k.indexOf('|');
    const row = { key: k.slice(0, cut), sid: k.slice(cut + 1), cents };
    if (!cents) continue;
    if (!bestNight  || cents > bestNight.cents)  bestNight  = row;
    if (!worstNight || cents < worstNight.cents) worstNight = row;
  }
  /* the longest run of won games, in the order they were actually bowled */
  const order = [...D.moneyRounds].sort((a, b) => {
    const A = D.session.get(a.session_id), B = D.session.get(b.session_id);
    return (A?.played_on || '').localeCompare(B?.played_on || '') || a.game_no - b.game_no;
  });
  const run = new Map(), best = new Map();
  for (const r of order){
    for (const k of r.winners){ run.set(k, (run.get(k) || 0) + 1);
      if ((run.get(k)) > (best.get(k) || 0)) best.set(k, run.get(k)); }
    for (const k of r.losers) run.set(k, 0);
    for (const k of r.evens) run.set(k, 0);      // level ends a run of wins too
  }
  const streak = [...best.entries()].sort((a, b) => b[1] - a[1])[0] || null;
  const ranked = everyPersonKey().map(k => moneyRecord(k)).filter(r => r.played >= 8);
  const sharpest = [...ranked].sort((a, b) => b.winPct - a.winPct)[0] || null;
  const busiest  = everyPersonKey().map(k => moneyRecord(k)).sort((a, b) => b.nights - a.nights)[0] || null;
  return { bestNight, worstNight, streak, sharpest, busiest };
}
