    ['Series', 'Games from one session added together. The 3-game and 4-game records are the best run of consecutive games inside a single night.'],
    ['Turkey, four-bagger, six-pack', 'Three strikes in a row is a turkey. Four is a four-bagger, five a five-bagger, six a six-pack. Twelve is a perfect game.'],
    GLOSS.sd, GLOSS.spare, GLOSS.firstball, GLOSS.tenth, GLOSS.c200, GLOSS.quick,
    ['Gutter Insurance', 'The lowest average of the year. It is awarded with affection and it is not optional.'],
  ]));
  return box;
}

/* ======================================================================
   TAB 6 — TEAMS
   ====================================================================== */
/* How many to a side. 2v2 and 2v2v2 are both "two to a side", because that is
   the thing that changes how a night plays — not how many sides there were.
   One to a side is everybody for themselves: a different number for everyone. */
const SIDE_TABS = [
  ['all', 'All',    null, 'Every game with money against it, whatever the sides were.'],
  ['1',   '1v1',    1,    'Everybody for themselves \u2014 a different number for every person.'],
  ['2',   'Pairs',  2,    'Two to a side. 2v2 and 2v2v2 both count here.'],
  ['3',   'Threes', 3,    'Three to a side.'],
  ['4',   'Fours',  4,    'Four to a side.'],
];
let teamsTab = 'all';

function tabTeams(){
  const box = h('div', {});
  const picked = SIDE_TABS.find(t => t[0] === teamsTab) || SIDE_TABS[0];
  const size = picked[2];
  const rounds = size == null ? D.moneyRounds : (D.roundsBySize.get(size) || []);
  const recs2  = size == null ? D.recordOf    : (D.recordBySize.get(size) || new Map());

  /* Only offer a size somebody has actually bowled, so the strip does not
     fill up with empty tabs on a book of nothing but doubles. */
  const seg = h('div.seg', {});
  for (const [id, label, sz] of SIDE_TABS){
    if (sz != null && !(D.roundsBySize.get(sz) || []).length && teamsTab !== id) continue;
    seg.append(h('button', { 'aria-pressed': teamsTab === id,
      onclick(){ teamsTab = id; render(); } }, label));
  }
  if (seg.children.length > 1) box.append(seg);
  box.append(h('p.tiny.muted', { style:{ margin:'8px 2px 4px' } }, picked[3]));

  if (size != null && !rounds.length){
    box.append(h('p.empty', {}, `No game has been bowled ${size} to a side yet.`));
    return box;
  }

  /* On the All tab the sides are all sorts, so pairs are the only unit that
     means anything across them. Inside a size, the side itself is the unit. */
  const groupSize = size == null ? 2 : size;
  const pairs = size === 1 ? [] : moneySides(2, rounds, groupSize);
  const unit = groupSize === 2 ? 'Two people' : groupSize === 3 ? 'Three people' : 'Four people';
  if (size === 1){
    box.append(sectionHead('Who you win with',
      'Nobody \u2014 one to a side means there are no partners to have.'));
  } else
  box.append(sectionHead('Who you win with',
    `${unit} at the same number in the same game were on the same side, so this needs no scores and no team ever typed in. Two games together to appear.`));
  if (size === 1){
    /* nothing: said above */
  } else if (!pairs.length){
    box.append(h('p.empty', {}, 'No two people have been on the same side twice yet.'));
  } else {
    const nameOf = p => p.names.join(' + ');
    const most = [...pairs].sort((a, b) => b.n - a.n)[0];
    /* with three pairs you have not got a best and a worst, you have got three
       numbers — so only claim one once there is a field to be top of */
    const enough = pairs.length >= 4;
    box.append(tiles([
      tile('Most often together', nameOf(most),
        `${most.n} games, ${most.nights} night${most.nights === 1 ? '' : 's'}`),
      enough ? tile(groupSize === 2 ? 'Best pairing' : 'Best side', nameOf(pairs[0]),
                 `${pc(pairs[0].together)} together, ${pairs[0].n} games`)
             : tile(groupSize === 2 ? 'Pairings so far' : 'Sides so far',
                 int(pairs.length), 'two games together or more'),
    ], 'two'));
    box.append(h('p.sub', { style:{ marginTop:'14px' } },
      `How much better they do together than they each do without the rest of `
      + `the side. A ${groupSize === 2 ? 'pair' : 'side'} on +20 win twenty games in a hundred `
      + `more often together than they manage apart; on \u221220 they are better off split up.`));
    box.append(card(divergingBars(pairs.filter(p => p.delta != null).map(p => ({
      label: p.names.join('+'), value: p.delta, unit:' pts',
      tipText: `${nameOf(p)} win ${pc(p.together)} of the ${p.n} games they have bowled `
             + `on the same side. Without each other they win ${pc(p.apart)} — `
             + p.names.map((n, i) => `${n} ${pc(p.solos[i])}`).join(', ') + '.',
    })))));
    box.append(h('div.card.pad0', {}, sortTable({
      initial:'delta', dir:-1,
      cols:[
        { key:'pair', label: groupSize === 2 ? 'Pair' : 'Side', text:true, value:p => nameOf(p) },
        { key:'n', label:'Games together', value:p => p.n },
        { key:'nights', label:'Nights', value:p => p.nights },
        { key:'won', label:'Won', value:p => p.won },
        { key:'together', label:'Win % together', value:p => p.together, fmt:pc },
        { key:'apart', label:'Win % without each other', value:p => p.apart, fmt:pc },
        { key:'delta', label:'Better together by', value:p => p.delta,
          cell:p => p.delta == null ? h('span.muted', {}, '\u2014')
            : h('span.n', { cls: p.delta >= 0 ? 'good' : 'bad' },
                (p.delta >= 0 ? '+' : '') + Math.round(p.delta)) },
      ], rows: pairs })));
  }

  /* Read off the money, not off the score sheet — so this fills in on every
     night anybody keeps the book, and a guest who will never make an account
     has a record here like everybody else. */
  box.append(sectionHead('Career record', size == null
    ? 'Every game the book has money against. Guests included.'
    : `Only the games bowled ${size} to a side. Guests included.`));
  const recs = everyPersonKey().map(k => moneyRecord(k, recs2)).filter(r => r.played > 0);
  box.append(h('div.card.pad0', {}, sortTable({
    initial:'pct', dir:-1,
    onRow:r => { if (!r.guest) showBowler(r.key.slice(2)); },
    empty:'Nobody has a game with money against it yet.',
    cols:[
      { key:'name', label:'Who', text:true, value:r => r.name + (r.guest ? ' (guest)' : '') },
      { key:'played', label:'Games', value:r => r.played },
      { key:'won', label:'Won', value:r => r.won },
      { key:'lost', label:'Lost', value:r => r.lost },
      /* Without this the row does not add up: games counts the nights you
         came out level, and won and lost between them do not. */
      { key:'even', label:'Level', value:r => r.even },
      { key:'pct', label:'Win %', value:r => r.winPct, fmt:pc },
      { key:'rating', label:'Rating', value:r => r.rating, fmt:v => v == null ? '—' : Math.round(v) },
      { key:'nights', label:'Nights', value:r => r.nights },
      { key:'money', label:'Money', value:r => r.net, fmt:v => money(v) },
      { key:'most', label:'Most with', text:true, value:r => r.mates[0]?.name || '—' },
      { key:'best', label:'Best with', text:true, value:r => r.best?.name || '—' },
      { key:'worst', label:'Never with', text:true, value:r => r.worst?.name || '—' },
    ], rows: recs })));

  box.append(sectionHead('Recent games', 'Each game and the sides read off the money.'));
  const nights = new Map(D.sessions.map(x => [x.id, x]));
  const moneyRecent = [...rounds]
    .filter(r => r.winners.length && r.losers.length && nights.has(r.session_id))
    .sort((a, b) => (nights.get(b.session_id).played_on).localeCompare(nights.get(a.session_id).played_on)
                 || b.game_no - a.game_no).slice(0, 12);
  if (!moneyRecent.length) box.append(h('p.empty', {}, 'No game has money against it yet.'));
  for (const r of moneyRecent){
    const ses = nights.get(r.session_id);
    box.append(h('button.card.tap', { style:{ display:'block', width:'100%' },
      onclick(){ showSession(r.session_id); } },
      h('div.spread', {}, h('div', { style:{ fontWeight:650 } },
          `${dateLabel(ses.played_on)} · game ${r.game_no}`),
        h('span.chip', {}, ses.house || '')),
      h('div', { style:{ marginTop:'8px' } }, sidesLine(r))));
  }

  box.append(sectionHead('Session MVPs', 'Highest series of the night.'));
  const mvps = new Map();
  for (const ses of D.sessions) if (ses.mvp && ses.mvp.n) mvps.set(ses.mvp.id, (mvps.get(ses.mvp.id) || 0) + 1);
  box.append(card(mvps.size
    ? barRows([...mvps.entries()].sort((a,b) => b[1] - a[1]).map(([id, n]) => ({
        label: D.stats.get(id)?.name || '?', value: n, text: String(n), color:'gd' })))
    : h('p.empty', {}, 'No sessions yet.')));

  box.append(glossary([
    ['Combined average', 'When these two are on the same team, every game either of them bowled that night, averaged.'],
    ['Their usual', 'The average of their two all-time averages — what you would expect from them normally.'],
    ['Difference', 'Combined average minus their usual. Green means the pair bowls better together than apart. It is not proof of anything, but it is fun.'],
    ['Win %', 'Games where your team had the most pins, out of games where teams were picked at all.'],
    ['MVP', 'One per night: the best mix of how you bowled and what you won.'],
    GLOSS.series,
  ]));
  return box;
}

      h('label.f', { style:{ marginTop:'10px' } }, h('span', {}, 'Email'), em),

      h('label.f', {}, h('span', {}, 'Change password'), pw), msg,

/* Is there a newer copy than the one I am holding?

   The site is served with max-age=600, so for ten minutes after a change your
   phone keeps handing you the old page and nothing about it looks stale — you
   just cannot find the thing you were told is there. So on start-up it asks
   the server, without the cache in the way, when this file was last changed.
   If that is newer than the copy running, it says so and offers to fetch it.
   One HEAD request, and it fails silently: a bad connection must never put a
   scary bar across a page that is working. */
async function checkForNewer(){
  try {
    const res = await fetch(location.pathname + '?v=' + Date.now(),
      { cache:'no-store', method:'HEAD' });
    const served = Date.parse(res.headers.get('last-modified') || '');
    const running = Date.parse(document.lastModified);
    if (!served || !running || served <= running + 2000) return;
    const bar = h('div.newer', {},
      h('span', {}, 'A newer version of the site is out.'),
      h('button', { onclick(){
        location.replace(location.pathname + '?fresh=' + Date.now() + location.hash);
      } }, 'Load it'),
      h('button.no', { 'aria-label':'Dismiss', onclick(){ bar.remove(); } }, '\u2715'));
    document.body.append(bar);
  } catch { /* offline, or the server will not say — either way, carry on */ }
}

/* Which copy of the site am I looking at?

   GitHub Pages serves this file with max-age=600, so for ten minutes after a
   change your phone is still holding the old one and there is no way to tell
   by looking. document.lastModified is the Last-Modified the file was served
   with — the moment it was actually deployed — so this stamp says which build
   is in front of you, and tapping it forces a fresh copy. */
function buildStamp(){
  const when = new Date(document.lastModified);
  const label = isNaN(when) ? 'unknown' : when.toLocaleString(undefined,
    { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
  return h('button.btn.sm.wide', { style:{ marginTop:'18px', opacity:'.7' },
    onclick(){
      /* a plain reload will happily serve the same cached file back */
      location.replace(location.pathname + '?fresh=' + Date.now() + location.hash);
    } },
    `Updated ${label} \u00b7 tap to check for a newer version`);
}

        { key:'avg', label:'Average', value:r => r.avg, fmt:one },
        { key:'games', label:'Games', value:r => r.games },
        { key:'high', label:'High', value:r => r.high },
        { key:'sd', label:'Consistency', value:r => r.sd, fmt:one },
        { key:'fb', label:'First ball', value:r => r.firstBall, fmt:one },
        { key:'strike', label:'Strike %', value:r => r.strikePct, fmt:pc },
        { key:'spare', label:'Spare %', value:r => r.sparePct, fmt:pc },
        { key:'tenth', label:'10th frame', value:r => r.tenthAvg, fmt:one },
      ],
      rows: scored,
    })));
  }
  return box;
}

/* ---- the archive: nights that are out of the book but not gone ---- */
function tabArchive(){
  const box = h('div', {});
  const put = state.archivedSessions || [];
  box.append(sectionHead('Archive',
    'Nights that are out of the book. They count for nothing \u2014 no records, no '
    + 'totals, no rankings \u2014 but nothing has been destroyed, and any of them can '
    + 'come back.'));
  if (!put.length){
    box.append(h('p.empty', {}, 'Nothing has been put away.'));
    return box;
  }
  for (const ses of put){
    const cash = (state.all.money || []).filter(m => m.session_id === ses.id);
    const games = new Set(cash.map(m => m.game_no)).size;
    const moved = cash.filter(m => m.amount_cents > 0).reduce((a, m) => a + m.amount_cents, 0);
    box.append(h('div.card', {},
      h('div.spread', {},
        h('div', {}, h('div', { style:{ fontWeight:700 } }, dateLabel(ses.played_on)),
          h('div.tiny.muted', {}, `${ses.house}${ses.title ? ' · ' + ses.title : ''}`)),
        h('span.chip', {}, games ? `${games} game${games === 1 ? '' : 's'}` : 'nothing in it')),
      moved ? h('p.tiny.muted', { style:{ marginTop:'6px' } },
        `${moneyFlat(moved)} changed hands that night.`) : null,
      h('div.grid2', { style:{ marginTop:'12px' } },
        h('button.btn.sm', { async onclick(){
          try {
            await setArchived(ses.id, false);
            toast('Back in the book'); render();
          } catch (err){ toast(saveError(err)); }
        } }, '\u21a9\ufe0f  Bring it back'),
        /* the only place in the site that destroys anything, and it says so */
        h('button.btn.sm.danger', { async onclick(){
          if (!confirm(`Destroy the night of ${dateLabel(ses.played_on)} for good?`
            + '\n\nThis is the one that does not come back.')) return;
          try {
            await db.deleteSession(ses.id);
            rememberArchived(ses.id, false);
            await load(); toast('Gone for good'); render();
          } catch (err){ toast(saveError(err)); }
        } }, 'Delete for good'))));
  }
  return box;
}

/* ======================================================================
   ROUTER + BOOT
   ====================================================================== */
const TABS = [
  ['home',     'Home',     tabHome],
  ['tonight',  'Tonight',  tabTonight],
  ['money',    'Money',    tabMoney],
  ['power',    'Power',    tabPower],
  ['log',      'Log',      tabLog],
  ['bowlers',  'People',   tabPeople],   // an old link; People is where it went
  ['sessions', 'Sessions', tabSessions],
  ['records',  'Records',  tabRecords],
  ['teams',    'Teams',    tabTeams],
  ['me',       'Me',       tabMe],
  ['stats',    'Stats',    tabStats],
  ['archive',  'Archive',  tabArchive],
  ['people',   'People',   tabPeople],
];

/* ---- the four places, and what lives inside each ----------------------
   Every tab id above still works, and every old #hash still resolves — the
   bar just decides which of the four lights up while you are on it. */
const ICON = {
  home:  'M3.6 10.4 12 4l8.4 6.4V20a1 1 0 0 1-1 1h-4.6v-6H9.2v6H4.6a1 1 0 0 1-1-1z',
  stats: 'M4 20V12M9.3 20V5M14.7 20v-6M20 20V9',
  money: null,
  people:'M9.2 5a3.4 3.4 0 1 1 0 6.8 3.4 3.4 0 0 1 0-6.8M3 20c0-3.4 2.8-5.4 6.2-5.4s6.2 2 6.2 5.4'
       + 'M16.4 5.4a3.4 3.4 0 0 1 0 6.5M17.6 14.9c2.1.6 3.4 2.4 3.4 5.1',
};
/* SVG lives in its own namespace: an <svg> built with createElement is an
   unknown HTML element and draws nothing at all. */
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, ...kids){
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  el.append(...kids);
  return el;
}
const icon = name => svgEl('svg', { class:'ic', viewBox:'0 0 24 24' },
  ...(name === 'money'
    ? [svgEl('rect', { x:'2.8', y:'5.6', width:'18.4', height:'12.8', rx:'2.4' }),
       svgEl('path', { d:'M12 8.6v6.8M13.9 10.2a2 2 0 0 0-3.8.6c0 1.9 3.8.8 3.8 2.7a2 2 0 0 1-3.8.6' })]
    : [svgEl('path', { d: ICON[name] })]));

const PLACES = [
  { id:'home',   label:'Home',   icon:'home',   holds:['home'] },
  { id:'stats',  label:'Stats',  icon:'stats',  holds:['stats','power','records','teams','sessions','log','archive'] },
  { id:'money',  label:'Money',  icon:'money',  holds:['money','tonight'] },
  { id:'people', label:'People', icon:'people', holds:['people','bowlers','me'] },
];

/* Everything that used to be its own tab, now one page you go through. */
const STATS_PAGES = [
  ['power',    '\u26a1', 'Power rankings', 'Who is actually winning, off the book'],
  ['teams',    '\u{1f91d}', 'Teams',          'Who you win with, read off the money'],
  ['records',  '\u{1f3c6}', 'Records',        'The money records, and the trophy case'],
  ['sessions', '\u{1f4c5}', 'Sessions',       'Every night out, one card each, all the way back'],
  ['log',      '\u270f\ufe0f', 'Log a session',  'Score it live, or type one up after'],
  ['archive',  '\u{1f4e6}', 'Archive',        'Nights you put away, and can bring back'],
];
function tabStats(){
  const box = h('div', {});
  box.append(sectionHead('Stats', 'The deep end. Nothing here is needed to keep a night.'));
  const list = h('div.golist', {});
  for (const [id, emoji, title, sub] of STATS_PAGES)
    list.append(h('button', { onclick(){ go(id); } },
      h('span.sq', {}, emoji),
      h('span', { style:{ flex:1, minWidth:0 } },
        h('span.t', {}, title), h('span.s', {}, sub)),
      h('span.chev', {}, '\u203a')));
  box.append(list);
  return box;
}

/* The button in the middle. Scores and money are separate books, and the
   whole point is that you can keep either one without the other. */
function whatAreYouDoing(){
  if (!state.user){ go('tonight'); return; }
  openSheet('What are you doing?', body => {
    const list = h('div.golist', {});
    const choice = (emoji, title, sub, run) =>
      list.append(h('button', { onclick(){ closeSheet(); run(); } },
        h('span.sq', {}, emoji),
        h('span', { style:{ flex:1, minWidth:0 } },
          h('span.t', {}, title), h('span.s', {}, sub)),
        h('span.chev', {}, '\u203a')));
    choice('\u{1f4b5}', 'Keep the money', 'Who won what \u2014 no scores needed', () => go('tonight'));
    choice('\u{1f3b3}', 'Score it live', 'The lane view, tap as you bowl', () => go('log'));
    choice('\u270f\ufe0f', 'Type in a night', 'For writing up one that already happened', () => go('log'));
    if (canReadPhotos())
      choice('\u{1f4f7}', 'Read it off a photo', 'The monitor, or your notes page', () => go('tonight'));
    body.append(list);
  }, 'Scores and money are separate books. Keep either, or both.');
}
let current = 'home';
function go(id){
  current = id;
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  render();
  window.scrollTo({ top: 0 });
}
function render(){
  const bar = clear($('#bar'));
  for (const place of PLACES){
    bar.append(h('button.nav', { 'aria-current': place.holds.includes(current) ? 'page' : 'false',
      onclick(){ go(place.goes || place.id); } },
      icon(place.icon), h('span.tx', {}, place.label)));
    if (place.id === 'stats')
      bar.append(h('button.fab', { 'aria-label':'Log a game or start a night',
        onclick: whatAreYouDoing }, '+'));
  }
  const build = (TABS.find(t => t[0] === current) || TABS[0])[2];
  const panel = $('#panel');
  const next = h('div', {});           // built detached, then swapped in
  try { next.append(build()); }
  catch (err){
    console.error(err);
    next.append(h('div.card', {}, h('h2', {}, 'Something broke'), h('p.small.muted', {}, String(err && err.message || err))));
  }
  panel.replaceChildren(next);
  document.body.classList.toggle('focus',
    (current === 'log' && !!(LIVE.session || LOG.entry)) || (current === 'tonight' && !!MONEY.session));
  clear($('#cta-root'));   // the button in the middle of the bar does this now
}
async function boot(reload){
  if (!db){
    try { db = STUB || !CONFIGURED ? stubDB() : await liveDB(); }
    catch (err){ db = stubDB(); state.error = err; }
    /* Supabase fires an event for the session it restores at start-up. boot()
       is already loading at that point, so only react to an actual change. */
    if (db.onChange) db.onChange(async user => {
      const was = state.user ? state.user.id : null;
      state.user = user;
      if (!state.ready || (user ? user.id : null) === was) return;
      await load(); render();
    });
  }
  state.user = await db.init();
  state.staleSchema = db.schemaReady ? !(await db.schemaReady()) : false;
  if (STUB && window.__STUB_USER) state.user = window.__STUB_USER;
  await load();
  const hash = location.hash.slice(1);
  if (!reload && TABS.some(t => t[0] === hash)) current = hash;
  state.ready = true;
  render();
  document.body.dataset.ready = '1';
  if (!STUB) checkForNewer();
}
window.addEventListener('hashchange', () => {
  const hash = location.hash.slice(1);
  if (TABS.some(t => t[0] === hash) && hash !== current) go(hash);
});
window.APP = { state, D, go, boot, render, B, setArchived };   // handy for the test harness
await boot();
</script>
